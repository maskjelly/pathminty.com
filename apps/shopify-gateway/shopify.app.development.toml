# Development launch config: heatmaps, journeys, and recordings.
# Order/refund webhooks stay in shopify.app.toml for post-PCD production.

client_id = "62b97c0201c60add657038e08ce9ba95"
application_url = "https://pathminty-shopify-gateway-dev.pathminty-collector.workers.dev"
embedded = true
name = "PathMinty"

[access_scopes]
scopes = "read_customer_events,read_pixels,write_pixels,write_app_proxy"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://pathminty-shopify-gateway-dev.pathminty-collector.workers.dev/auth/callback" ]

[app_proxy]
url = "/pathminty-proxy"
prefix = "apps"
subpath = "pathminty"

[build]
automatically_update_urls_on_dev = true
